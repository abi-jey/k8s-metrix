site_name: k8s-metrix Documentation
site_description: Kubernetes custom metrics collection system for HPA and monitoring
site_author: abi_jey
site_url: https://abi-jey.github.io/k8s-metrix

repo_url: https://github.com/abi-jey/k8s-metrix
repo_name: abi-jey/k8s-metrix
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quick-start.md
    - Installation: getting-started/installation.md
    - Basic Usage: getting-started/basic-usage.md
  - Configuration:
    - Client Configuration: configuration/client.md
    - Environment Variables: configuration/environment.md
    - Backend Options: configuration/backends.md
  - Deployment:
    - Kubernetes Deployment: deployment/kubernetes.md
    - TLS Setup: deployment/tls-setup.md
    - Docker Deployment: deployment/docker.md
  - Integrations:
    - FastAPI Integration: integrations/fastapi.md
    - Custom Integrations: integrations/custom.md
  - Monitoring:
    - Metrics Types: monitoring/metrics-types.md
    - HPA Configuration: monitoring/hpa.md
    - Load Testing: monitoring/load-testing.md
  - API Reference:
    - K8sMetrix Class: api/k8smetrix.md
    - Adapter API: api/adapter.md
    - Backends: api/backends.md
  - Examples:
    - FastAPI Example: examples/fastapi.md
    - Custom Metrics: examples/custom-metrics.md
  - Development:
    - Contributing: development/contributing.md
    - Building: development/building.md
    - Testing: development/testing.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/abi-jey/k8s-metrix
  version:
    provider: mike
    default: stable

copyright: Copyright &copy; 2025 k8s-metrix contributors
