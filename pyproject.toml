[project]
name = "k8s-metrix"
version = "0.1.1a31"
description = "Kubernetes custom metrics collection system for HPA and monitoring"
authors = [
    {name = "abi_jey",email = "abi-jey@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic (>=2.1.0,<3.0.0)",
    "cryptography>=41.0.0",
    "aiohttp>=3.8.0"
]

[tool.poetry]
packages = [
    {include = "k8s_metrix",from = "src"}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
fastapi = "*"
uvicorn = "*"
pre-commit = "*"
websockets = "^15.0.1"
kubernetes = ">=28.1.0"
rich = "^14.0.0"
mkdocs-material = ">=9.0.0"
mkdocs-autorefs = "*"
mkdocstrings = "*"
mkdocstrings-python = "*"
mkdocs = ">=1.4.3"
poethepoet = ">=0.19.0"

[tool.poe.tasks]
# Documentation tasks
docs = "mkdocs serve"
docs-build = "mkdocs build"
docs-deploy = "mkdocs gh-deploy"

# Server tasks
serve = "uvicorn k8s_metrix.adapter.main:app --host 0.0.0.0 --port 8080 --reload"
serve-example = "uvicorn examples.fastapi.main:app --host 0.0.0.0 --port 8080 --reload"
serve-prod = "uvicorn k8s_metrix.adapter.main:app --host 0.0.0.0 --port 8080"

# Development tasks
dev = "uvicorn examples.fastapi.main:app --host localhost --port 8080 --reload"
test = "pytest"
lint = "pre-commit run --all-files"
load-test = "python load_test.py"

# Build tasks
build = "poetry build"
install = "pip install -e ."

